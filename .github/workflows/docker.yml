name: ovn-docker-images

on:
  push:
    branches: [ master, release-* ]
    tags: [ 'v*' ]
  workflow_dispatch:
    # Lets sync-upstream (or a human) rebuild any historical tag using the
    # workflow definition on master. Plain tag-push events use the workflow
    # file at the tag commit, which predates this repo's docker.yml tweaks.
    inputs:
      tag:
        description: 'Git tag/ref to check out + image tag (e.g. v1.3.3). Empty = use the dispatched branch ref.'
        required: false
        default: ''
      images:
        description: 'Which images to build'
        required: false
        default: both
        type: choice
        options: [both, fedora, ubuntu]
      platforms:
        description: 'Which platforms to build'
        required: false
        default: both
        type: choice
        options: [both, amd64, arm64]
      dry_run:
        description: 'Print discovered matrix and exit (no builds)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io 
  OWNER: ${{ github.repository_owner }}
  REPOSITORY: ovn-kubernetes
  FEDORA_IMAGE_NAME: ovn-kube-fedora
  UBUNTU_IMAGE_NAME: ovn-kube-ubuntu
  BUILDER_IMAGE: quay.io/projectquay/golang:1.26
jobs:
  # Resolve which images / platforms to build. Push events build everything;
  # workflow_dispatch can scope down via inputs.
  discover:
    runs-on: ubuntu-latest
    outputs:
      fedora_matrix: ${{ steps.gen.outputs.fedora_matrix }}
      ubuntu_matrix: ${{ steps.gen.outputs.ubuntu_matrix }}
      build_fedora: ${{ steps.gen.outputs.build_fedora }}
      build_ubuntu: ${{ steps.gen.outputs.build_ubuntu }}
    steps:
      - id: gen
        run: |
          set -euo pipefail
          images="${{ inputs.images }}"
          platforms="${{ inputs.platforms }}"
          dry="${{ inputs.dry_run }}"
          # Push events leave inputs.* empty -> default to building everything.
          [[ -z "$images"    ]] && images=both
          [[ -z "$platforms" ]] && platforms=both

          if [[ "$dry" == "true" ]]; then
            bf=false; bu=false
          else
            [[ "$images" == both || "$images" == fedora ]] && bf=true || bf=false
            [[ "$images" == both || "$images" == ubuntu ]] && bu=true || bu=false
          fi

          # Each arch builds on a native GitHub-hosted runner -- free for
          # public repos, including the arm64 fleet -- so no QEMU emulation.
          amd64_entry='{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-24.04"}'
          arm64_entry='{"platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm"}'
          case "$platforms" in
            both)  pm="[${amd64_entry},${arm64_entry}]" ;;
            amd64) pm="[${amd64_entry}]" ;;
            arm64) pm="[${arm64_entry}]" ;;
          esac

          # Empty matrix when image isn't selected; GitHub Actions then skips
          # the job *invisibly* (no "skipped" row in the UI, no literal
          # `${{ matrix.X }}` shown). Job-level `if:` makes the job appear
          # as skipped with the unevaluated name -- empty matrix doesn't.
          [[ "$bf" == true ]] && fm="$pm" || fm='[]'
          [[ "$bu" == true ]] && um="$pm" || um='[]'

          {
            echo "fedora_matrix=$fm"
            echo "ubuntu_matrix=$um"
            echo "build_fedora=$bf"
            echo "build_ubuntu=$bu"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Discovered build plan"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| event | ${{ github.event_name }} |"
            echo "| ref | ${{ github.ref }} |"
            echo "| inputs.tag | ${{ inputs.tag }} |"
            echo "| images | ${images} |"
            echo "| platforms | ${platforms} |"
            echo "| dry_run | ${dry} |"
            echo "| build_fedora | ${bf} |"
            echo "| build_ubuntu | ${bu} |"
            echo ""
            echo '```json'
            echo "fedora_matrix=$fm"
            echo "ubuntu_matrix=$um"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Build Fedora image for each platform
  build-fedora:
    name: Build Fedora (${{ matrix.platform }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.discover.outputs.fedora_matrix) }}
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for fedora ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Build and push Fedora based Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ./dist/images/Dockerfile.fedora
        push: true
        build-args: |
          BUILDER_IMAGE=${{ env.BUILDER_IMAGE }}
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=fedora-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=fedora-${{ env.PLATFORM_PAIR }}
        # Provenance/SBOM attestations create an extra manifest under the
        # returned image-digest, which makes `docker buildx imagetools create`
        # fail with "@sha256:... not found" in the merge step. Disable them
        # so push-by-digest returns the actual image manifest digest.
        provenance: false
        sbom: false
        outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        # runner.temp is per-job, so digests never leak between runs.
        mkdir -p "${RUNNER_TEMP}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-fedora-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # Merge Fedora multi-platform images
  merge-fedora:
    name: Merge Fedora
    needs: [discover, build-fedora]
    # See comment on merge-ubuntu's `if:` (added in the previous commit).
    if: needs.discover.outputs.build_fedora == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-fedora-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for fedora ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Build Ubuntu image for each platform
  build-ubuntu:
    name: Build Ubuntu (${{ matrix.platform }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.discover.outputs.ubuntu_matrix) }}
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go-controller/go.mod'
        # Disabling cache to avoid warnings until these two issues are fixed
        # https://github.com/actions/setup-go/issues/424
        # https://github.com/actions/setup-go/issues/403
        # cache-dependency-path: "**/*.sum"
        cache: false
      id: go

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # TODO: this is not hermetic; switch to in-docker build of binaries
    - name: Build ovnkube-binaries and stage image context
      env:
        # Native on both runners now, but keep GOARCH explicit so the
        # binaries never depend on the runner's default. build-go.sh uses
        # CGO_ENABLED=0, so this also cross-compiles cleanly if the matrix
        # ever pairs an arch with a non-matching runner again.
        GOARCH: ${{ matrix.arch }}
      run: |
        make -C dist/images bld

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for ubuntu ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Build and push Ubuntu based Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ./dist/images
        file: ./dist/images/Dockerfile.ubuntu
        push: true
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=ubuntu-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=ubuntu-${{ env.PLATFORM_PAIR }}
        # See provenance: false comment in build-fedora above.
        provenance: false
        sbom: false
        outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        # See comment on Fedora's Export digest above.
        mkdir -p "${RUNNER_TEMP}/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-ubuntu-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # Merge Ubuntu multi-platform images
  merge-ubuntu:
    name: Merge Ubuntu
    needs: [discover, build-ubuntu]
    # See comment on merge-fedora's `if:`.
    if: needs.discover.outputs.build_ubuntu == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-ubuntu-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for ubuntu ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
