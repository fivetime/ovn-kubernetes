name: ovn-docker-images

on:
  push:
    branches: [ master, release-* ]
    tags: [ 'v*' ]
  workflow_dispatch:
    # Lets sync-upstream (or a human) rebuild any historical tag using the
    # workflow definition on master. Plain tag-push events use the workflow
    # file at the tag commit, which predates this repo's docker.yml tweaks.
    inputs:
      tag:
        description: 'Git tag/ref to build and tag the image with (e.g. v1.3.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io 
  OWNER: ${{ github.repository_owner }}
  REPOSITORY: ovn-kubernetes
  FEDORA_IMAGE_NAME: ovn-kube-fedora
  UBUNTU_IMAGE_NAME: ovn-kube-ubuntu
  BUILDER_IMAGE: quay.io/projectquay/golang:1.25
jobs:
  # Build Fedora image for each platform
  build-fedora:
    name: Build Fedora (${{ matrix.platform }})
    runs-on: self-hosted
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: linux/amd64
          arch: amd64
        # arm64 temporarily disabled while shipping v1.3.2 hotfix; re-add once
        # the amd64 image is published.
        # - platform: linux/arm64
        #   arch: arm64
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for fedora ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Build and push Fedora based Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ./dist/images/Dockerfile.fedora
        push: true
        build-args: |
          BUILDER_IMAGE=${{ env.BUILDER_IMAGE }}
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=fedora-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=fedora-${{ env.PLATFORM_PAIR }}
        outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-fedora-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  # Merge Fedora multi-platform images
  merge-fedora:
    name: Merge Fedora
    runs-on: self-hosted
    needs: build-fedora
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-fedora-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for fedora ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.FEDORA_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Build Ubuntu image for each platform
  build-ubuntu:
    name: Build Ubuntu (${{ matrix.platform }})
    runs-on: self-hosted
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: linux/amd64
          arch: amd64
        # arm64 temporarily disabled while shipping v1.3.2 hotfix; re-add once
        # the amd64 image is published.
        # - platform: linux/arm64
        #   arch: arm64
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go-controller/go.mod'
        # Disabling cache to avoid warnings until these two issues are fixed
        # https://github.com/actions/setup-go/issues/424
        # https://github.com/actions/setup-go/issues/403
        # cache-dependency-path: "**/*.sum"
        cache: false
      id: go

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # TODO: this is not hermetic; switch to in-docker build of binaries
    - name: Build ovnkube-binaries and stage image context
      env:
        # build-go.sh uses CGO_ENABLED=0, so GOARCH alone cross-compiles
        # cleanly without needing a C toolchain for the target arch.
        GOARCH: ${{ matrix.arch }}
      run: |
        make -C dist/images bld

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for ubuntu ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Build and push Ubuntu based Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ./dist/images
        file: ./dist/images/Dockerfile.ubuntu
        push: true
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=ubuntu-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,mode=max,scope=ubuntu-${{ env.PLATFORM_PAIR }}
        outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-ubuntu-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  # Merge Ubuntu multi-platform images
  merge-ubuntu:
    name: Merge Ubuntu
    runs-on: self-hosted
    needs: build-ubuntu
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-ubuntu-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GH Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for ubuntu ovn-k image
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPOSITORY }}/${{ env.UBUNTU_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
